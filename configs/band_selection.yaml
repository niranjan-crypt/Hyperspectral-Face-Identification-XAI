# Configuration for Metaheuristic Band Selection (PSO, GA, GWO)
band_selection:
  min_selected_bands: 5
  max_selected_bands: 20
  target_edge_bands: 10
  tau_spectral_diversity: 0.15

objective_weights:
  gamma_complementarity: 0.25
  delta_diversity: 0.20
  lambda_redundancy: 0.30
  eta_sparsity: 0.15
  xi_stability: 0.10

pso:
  n_particles: 30
  max_iter: 100
  w_inertia: 0.729
  c1_cognitive: 1.494
  c2_social: 1.494
  threshold: 0.50

ga:
  population_size: 50
  generations: 80
  crossover_prob: 0.8
  mutation_min: 0.01
  mutation_max: 0.15
  alpha_identity_guidance: 0.60

gwo:
  n_wolves: 25
  max_iter: 70
